<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Inter, -apple-system, system-ui, sans-serif">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2230"/>
      <stop offset="1" stop-color="#141A24"/>
    </linearGradient>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8DEF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="#0A0E14"/>

  <!-- back-link + title -->
  <text x="80" y="70" fill="#4FD1E0" font-size="13" font-weight="600">← Back to 7th Grade ELA</text>
  <text x="80" y="120" fill="#6E7C8C" font-size="12" letter-spacing="1.6" font-weight="600">STUDENT PROFILE · CROSS-CLASS VIEW</text>

  <circle cx="102" cy="168" r="28" fill="url(#avatar)"/>
  <text x="102" y="176" text-anchor="middle" fill="#F4F7FA" font-size="18" font-weight="700">J</text>
  <text x="150" y="164" fill="#F4F7FA" font-size="32" font-weight="700">Jordan T.</text>
  <text x="150" y="192" fill="#8A97A8" font-size="14">7th grade · IEP · Reading &amp; Math · 23 sessions logged this marking period</text>

  <!-- class chips -->
  <g transform="translate(1050,150)" font-size="12" font-weight="600">
    <text x="0" y="0" fill="#6E7C8C" letter-spacing="1.2">CLASSES</text>
    <g transform="translate(0,14)">
      <rect x="0" y="0" width="130" height="30" rx="15" fill="#141A24" stroke="#4FD1E0" stroke-width="1"/>
      <text x="65" y="20" text-anchor="middle" fill="#4FD1E0">7th ELA · Pull-out</text>
      <rect x="140" y="0" width="140" height="30" rx="15" fill="#141A24" stroke="#F5A623" stroke-width="1"/>
      <text x="210" y="20" text-anchor="middle" fill="#F5A623">7th I&amp;S · Push-in</text>
      <rect x="290" y="0" width="130" height="30" rx="15" fill="#141A24" stroke="#A78BFA" stroke-width="1"/>
      <text x="355" y="20" text-anchor="middle" fill="#A78BFA">6th Math · Pull-out</text>
    </g>
  </g>

  <!-- KPI TILES -->
  <g transform="translate(80,240)">
    <rect x="0" y="0" width="340" height="110" rx="12" fill="url(#panel)"/>
    <text x="24" y="34" fill="#6E7C8C" font-size="11" letter-spacing="1.4" font-weight="600">GOAL — MET %</text>
    <text x="24" y="82" fill="#F4F7FA" font-size="42" font-weight="700">68<tspan font-size="24" fill="#8A97A8">%</tspan></text>
    <text x="24" y="102" fill="#4ADE80" font-size="12" font-weight="600">▲ +14 pts vs last period</text>

    <rect x="358" y="0" width="340" height="110" rx="12" fill="url(#panel)"/>
    <text x="382" y="34" fill="#6E7C8C" font-size="11" letter-spacing="1.4" font-weight="600">INDEP — MET %</text>
    <text x="382" y="82" fill="#F4F7FA" font-size="42" font-weight="700">41<tspan font-size="24" fill="#8A97A8">%</tspan></text>
    <text x="382" y="102" fill="#4FD1E0" font-size="12" font-weight="600">▲ +9 pts vs last period</text>

    <rect x="716" y="0" width="340" height="110" rx="12" fill="url(#panel)"/>
    <text x="740" y="34" fill="#6E7C8C" font-size="11" letter-spacing="1.4" font-weight="600">INTERVENTIONS / SESSION</text>
    <text x="740" y="82" fill="#F4F7FA" font-size="42" font-weight="700">2.6</text>
    <text x="740" y="102" fill="#8A97A8" font-size="12" font-weight="600">▼ down from 3.4</text>

    <rect x="1074" y="0" width="340" height="110" rx="12" fill="url(#panel)"/>
    <text x="1098" y="34" fill="#6E7C8C" font-size="11" letter-spacing="1.4" font-weight="600">SESSIONS LOGGED</text>
    <text x="1098" y="82" fill="#F4F7FA" font-size="42" font-weight="700">23</text>
    <text x="1098" y="102" fill="#8A97A8" font-size="12">across 3 classes · since Jun 3</text>
  </g>

  <!-- CHART PANEL -->
  <g transform="translate(80,380)">
    <rect x="0" y="0" width="1000" height="380" rx="12" fill="url(#panel)"/>
    <text x="24" y="34" fill="#F4F7FA" font-size="16" font-weight="700">Goal &amp; independence over time</text>
    <text x="24" y="54" fill="#8A97A8" font-size="12">Score by session · 1 not met · 2 progressing · 3 met · line per class</text>

    <!-- legend -->
    <g transform="translate(700,30)" font-size="11">
      <circle cx="0" cy="0" r="5" fill="#4FD1E0"/><text x="10" y="4" fill="#C8D0DC">7th ELA (goal)</text>
      <circle cx="110" cy="0" r="5" fill="#F5A623"/><text x="120" y="4" fill="#C8D0DC">7th I&amp;S (goal)</text>
      <circle cx="220" cy="0" r="5" fill="#A78BFA"/><text x="230" y="4" fill="#C8D0DC">6th Math (goal)</text>
      <rect x="-5" y="18" width="10" height="2" fill="#4ADE80"/><text x="10" y="22" fill="#C8D0DC">Independence (all classes, avg)</text>
    </g>

    <!-- chart area -->
    <g transform="translate(60,100)">
      <!-- grid -->
      <line x1="0" y1="0" x2="900" y2="0" stroke="#1B2431"/>
      <line x1="0" y1="80" x2="900" y2="80" stroke="#1B2431"/>
      <line x1="0" y1="160" x2="900" y2="160" stroke="#1B2431"/>
      <line x1="0" y1="240" x2="900" y2="240" stroke="#1B2431"/>
      <text x="-8" y="4" text-anchor="end" fill="#6E7C8C" font-size="11">Met</text>
      <text x="-8" y="84" text-anchor="end" fill="#6E7C8C" font-size="11">Prog.</text>
      <text x="-8" y="164" text-anchor="end" fill="#6E7C8C" font-size="11">Not met</text>

      <!-- x labels -->
      <g fill="#6E7C8C" font-size="10">
        <text x="0" y="262" text-anchor="middle">Jun 3</text>
        <text x="150" y="262" text-anchor="middle">Jun 10</text>
        <text x="300" y="262" text-anchor="middle">Jun 17</text>
        <text x="450" y="262" text-anchor="middle">Jun 24</text>
        <text x="600" y="262" text-anchor="middle">Jul 8</text>
        <text x="750" y="262" text-anchor="middle">Jul 15</text>
        <text x="900" y="262" text-anchor="middle">Jul 22</text>
      </g>

      <!-- ELA line (cyan) trending up -->
      <polyline fill="none" stroke="#4FD1E0" stroke-width="2.5"
        points="0,160 150,160 300,80 450,80 600,80 750,0 900,0"/>
      <g fill="#4FD1E0">
        <circle cx="0" cy="160" r="4"/><circle cx="150" cy="160" r="4"/>
        <circle cx="300" cy="80" r="4"/><circle cx="450" cy="80" r="4"/>
        <circle cx="600" cy="80" r="4"/><circle cx="750" cy="0" r="4"/><circle cx="900" cy="0" r="4"/>
      </g>

      <!-- I&S line (amber) noisy -->
      <polyline fill="none" stroke="#F5A623" stroke-width="2.5" stroke-dasharray="1"
        points="0,160 150,80 300,160 450,80 600,80 750,80 900,0"/>
      <g fill="#F5A623">
        <circle cx="0" cy="160" r="4"/><circle cx="150" cy="80" r="4"/>
        <circle cx="300" cy="160" r="4"/><circle cx="450" cy="80" r="4"/>
        <circle cx="600" cy="80" r="4"/><circle cx="750" cy="80" r="4"/><circle cx="900" cy="0" r="4"/>
      </g>

      <!-- Math line (purple) -->
      <polyline fill="none" stroke="#A78BFA" stroke-width="2.5"
        points="0,160 150,160 300,80 450,80 600,0 750,80 900,0"/>
      <g fill="#A78BFA">
        <circle cx="0" cy="160" r="4"/><circle cx="150" cy="160" r="4"/>
        <circle cx="300" cy="80" r="4"/><circle cx="450" cy="80" r="4"/>
        <circle cx="600" cy="0" r="4"/><circle cx="750" cy="80" r="4"/><circle cx="900" cy="0" r="4"/>
      </g>

      <!-- Independence avg line (green, thicker, subtle) -->
      <polyline fill="none" stroke="#4ADE80" stroke-width="2" stroke-dasharray="6 4" opacity="0.85"
        points="0,240 150,200 300,160 450,140 600,120 750,90 900,60"/>
    </g>
  </g>

  <!-- TAG FREQUENCY -->
  <g transform="translate(1100,380)">
    <rect x="0" y="0" width="420" height="380" rx="12" fill="url(#panel)"/>
    <text x="24" y="34" fill="#F4F7FA" font-size="16" font-weight="700">Interventions used most</text>
    <text x="24" y="54" fill="#8A97A8" font-size="12">This marking period · across all 3 classes</text>

    <g transform="translate(24,90)" font-size="12">
      <text x="0" y="0" fill="#C8D0DC">"who + did what" frame</text>
      <rect x="0" y="10" width="370" height="10" rx="5" fill="#0E141C"/>
      <rect x="0" y="10" width="260" height="10" rx="5" fill="#F5A623"/>
      <text x="378" y="19" fill="#F5A623" font-weight="700">17</text>

      <text x="0" y="46" fill="#C8D0DC">Chunked passage / task</text>
      <rect x="0" y="56" width="370" height="10" rx="5" fill="#0E141C"/>
      <rect x="0" y="56" width="200" height="10" rx="5" fill="#F5A623"/>
      <text x="378" y="65" fill="#F5A623" font-weight="700">13</text>

      <text x="0" y="92" fill="#C8D0DC">Sentence frame</text>
      <rect x="0" y="102" width="370" height="10" rx="5" fill="#0E141C"/>
      <rect x="0" y="102" width="170" height="10" rx="5" fill="#F5A623"/>
      <text x="378" y="111" fill="#F5A623" font-weight="700">11</text>

      <text x="0" y="138" fill="#C8D0DC">Anchor chart</text>
      <rect x="0" y="148" width="370" height="10" rx="5" fill="#0E141C"/>
      <rect x="0" y="148" width="120" height="10" rx="5" fill="#F5A623"/>
      <text x="378" y="157" fill="#F5A623" font-weight="700">8</text>

      <text x="0" y="184" fill="#C8D0DC">Redirect</text>
      <rect x="0" y="194" width="370" height="10" rx="5" fill="#0E141C"/>
      <rect x="0" y="194" width="90" height="10" rx="5" fill="#F5A623"/>
      <text x="378" y="203" fill="#F5A623" font-weight="700">6</text>

      <text x="0" y="230" fill="#C8D0DC">Peer partner</text>
      <rect x="0" y="240" width="370" height="10" rx="5" fill="#0E141C"/>
      <rect x="0" y="240" width="60" height="10" rx="5" fill="#F5A623"/>
      <text x="378" y="249" fill="#F5A623" font-weight="700">4</text>

      <text x="0" y="276" fill="#C8D0DC">Break card</text>
      <rect x="0" y="286" width="370" height="10" rx="5" fill="#0E141C"/>
      <rect x="0" y="286" width="30" height="10" rx="5" fill="#F5A623"/>
      <text x="378" y="295" fill="#F5A623" font-weight="700">2</text>
    </g>
  </g>

  <!-- NOTES FEED -->
  <g transform="translate(80,790)">
    <rect x="0" y="0" width="1440" height="180" rx="12" fill="url(#panel)"/>
    <text x="24" y="34" fill="#F4F7FA" font-size="16" font-weight="700">Recent notes across classes</text>

    <g font-size="12">
      <!-- entry 1 -->
      <text x="24" y="70" fill="#4FD1E0" font-weight="600" letter-spacing="1">JUL 28 · 7TH ELA</text>
      <text x="24" y="90" fill="#C8D0DC">Identified main idea in 2 of 3 short passages independently. Third used "who+did what" frame after one redirect.</text>

      <text x="720" y="70" fill="#F5A623" font-weight="600" letter-spacing="1">JUL 25 · 7TH I&amp;S</text>
      <text x="720" y="90" fill="#C8D0DC">Volunteered a claim in whole-group discussion. Peer partner scaffolded the evidence sentence.</text>

      <text x="24" y="130" fill="#A78BFA" font-weight="600" letter-spacing="1">JUL 24 · 6TH MATH</text>
      <text x="24" y="150" fill="#C8D0DC">Number-line strategy applied unprompted for integer subtraction. First time this month.</text>

      <text x="720" y="130" fill="#4FD1E0" font-weight="600" letter-spacing="1">JUL 22 · 7TH ELA</text>
      <text x="720" y="150" fill="#C8D0DC">Refused first prompt. Break card + 5-min reset → completed with anchor chart. Plan: shorten task next session.</text>
    </g>
  </g>
</svg>
