<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Inter, -apple-system, system-ui, sans-serif">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2230"/>
      <stop offset="1" stop-color="#141A24"/>
    </linearGradient>
    <linearGradient id="glowStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FD1E0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#4FD1E0" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="900" height="620" fill="#050608"/>

  <!-- cyan glow behind card -->
  <rect x="130" y="60" width="640" height="500" rx="24" fill="#4FD1E0" opacity="0.10" filter="url(#softGlow)"/>

  <!-- card -->
  <rect x="140" y="70" width="620" height="480" rx="18" fill="url(#panel)" stroke="#4FD1E0" stroke-width="1.5"/>

  <!-- header row -->
  <circle cx="188" cy="118" r="26" fill="#152229"/>
  <text x="188" y="126" text-anchor="middle" fill="#4FD1E0" font-size="20" font-weight="700">J</text>
  <text x="228" y="112" fill="#F4F7FA" font-size="26" font-weight="700">Jordan T.</text>
  <text x="228" y="136" fill="#8A97A8" font-size="14">7th ELA · IEP goal: main-idea identification</text>

  <text x="720" y="110" text-anchor="end" fill="#4FD1E0" font-size="13" font-weight="600">Progress Charts →</text>
  <text x="720" y="132" text-anchor="end" fill="#6E7C8C" font-size="12">Session #23 · Tue Jul 28</text>

  <!-- notes -->
  <rect x="164" y="164" width="572" height="82" rx="8" fill="#0E141C" stroke="#1B2431"/>
  <text x="180" y="188" fill="#C8D0DC" font-size="14">Identified main idea in 2 of 3 short passages independently.</text>
  <text x="180" y="210" fill="#C8D0DC" font-size="14">Third passage: used the "who + did what" frame after one</text>
  <text x="180" y="232" fill="#C8D0DC" font-size="14">redirect. Ready to try a 5-paragraph text next session.</text>

  <!-- STATUS -->
  <rect x="164" y="262" width="572" height="44" rx="8" fill="#0E141C"/>
  <rect x="164" y="262" width="4" height="44" fill="#4ADE80"/>
  <text x="184" y="289" fill="#6E7C8C" font-size="11" letter-spacing="1.4" font-weight="600">STATUS</text>
  <text x="720" y="289" text-anchor="end" fill="#4ADE80" font-size="14" font-weight="600">Present</text>

  <!-- GOAL -->
  <rect x="164" y="316" width="572" height="44" rx="8" fill="#0E141C"/>
  <rect x="164" y="316" width="4" height="44" fill="#4FD1E0"/>
  <text x="184" y="343" fill="#6E7C8C" font-size="11" letter-spacing="1.4" font-weight="600">GOAL</text>
  <!-- tri-state dots on right -->
  <g transform="translate(580,335)">
    <circle cx="0" cy="0" r="9" fill="#2A1418" stroke="#F87171" stroke-width="1"/>
    <circle cx="28" cy="0" r="9" fill="#0F2029" stroke="#4FD1E0" stroke-width="1"/>
    <circle cx="56" cy="0" r="11" fill="#4ADE80"/>
  </g>
  <text x="720" y="343" text-anchor="end" fill="#4ADE80" font-size="14" font-weight="600">Met</text>

  <!-- INDEP -->
  <rect x="164" y="370" width="572" height="44" rx="8" fill="#0E141C"/>
  <rect x="164" y="370" width="4" height="44" fill="#A78BFA"/>
  <text x="184" y="397" fill="#6E7C8C" font-size="11" letter-spacing="1.4" font-weight="600">INDEP</text>
  <g transform="translate(580,389)">
    <circle cx="0" cy="0" r="9" fill="#2A1418" stroke="#F87171" stroke-width="1"/>
    <circle cx="28" cy="0" r="11" fill="#4FD1E0"/>
    <circle cx="56" cy="0" r="9" fill="#12261D" stroke="#4ADE80" stroke-width="1"/>
  </g>
  <text x="720" y="397" text-anchor="end" fill="#4FD1E0" font-size="14" font-weight="600">Progressing</text>

  <!-- INTERV -->
  <rect x="164" y="424" width="572" height="110" rx="8" fill="#0E141C"/>
  <rect x="164" y="424" width="4" height="110" fill="#F5A623"/>
  <text x="184" y="451" fill="#6E7C8C" font-size="11" letter-spacing="1.4" font-weight="600">INTERV</text>
  <text x="720" y="451" text-anchor="end" fill="#F5A623" font-size="14" font-weight="700">3 today</text>

  <g font-size="12" font-weight="500">
    <rect x="184" y="466" width="130" height="24" rx="12" fill="#2A1F0E"/>
    <text x="249" y="483" text-anchor="middle" fill="#F5A623">"who + did what" frame</text>

    <rect x="322" y="466" width="106" height="24" rx="12" fill="#2A1F0E"/>
    <text x="375" y="483" text-anchor="middle" fill="#F5A623">Chunked passage</text>

    <rect x="436" y="466" width="86" height="24" rx="12" fill="#2A1F0E"/>
    <text x="479" y="483" text-anchor="middle" fill="#F5A623">1 redirect</text>

    <!-- add-tag pill -->
    <rect x="184" y="498" width="60" height="24" rx="12" fill="#141A24" stroke="#2A1F0E" stroke-dasharray="3 3"/>
    <text x="214" y="515" text-anchor="middle" fill="#6E7C8C">+ tag</text>
  </g>
</svg>
